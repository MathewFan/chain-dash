services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chaindash
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: chaindash
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chaindash"]
      interval: 2s
      timeout: 2s
      retries: 20
